white;padding:12px 22px;border-radius:8px;z-index:30}a{color:#1768e8;text-decoration:none}.empty{text-align:center;padding:30px 0;color:#8b96a8}@media(max-width:1100px){.layout{grid-template-columns:280px minmax(380px,1fr)}.right{display:none}}@media(max-width:700px){.layout{display:block;height:auto}.left{border-bottom:1px solid #ddd}.chat{min-height:650px}.top small{display:none}}

.memory-data-page #cards{display:block;margin-top:18px}.memory-tr{display:grid;grid-template-columns:minmax(250px,1fr) 140px 90px 70px;align-items:center;gap:18px;padding:20px 12px;border-bottom:1px solid #e5eaf2}.memory-th{color:#8694a9;background:#fafbfd;padding:14px 12px}.memory-tr p{margin:0 0 5px}.tag{font-style:normal}.drawer h3{margin-top:26px}.drawer textarea{margin:0;line-height:1.8}.memory-info{background:#f2f6fc;border-radius:9px;padding:16px;color:#6a7e9b;font-size:13px;line-height:1.9}.memory-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:28px}.danger{color:#e75b65}.memory-data-page .note{margin-top:20px}

.memory-data-page{background:#fbfcfe}.memory-data-page .layout{padding:30px 32px}.memory-data-page .left{background:transparent;border:0;padding:0;max-width:1320px}.memory-data-page .left>.tabs{display:none}.memory-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.memory-heading h2{font-size:24px;margin:0 0 8px}.memory-heading p{color:#8190a8;margin:0;font-size:14px}.memory-heading #add{padding:12px 17px;border-radius:9px;font-weight:600}.memory-scope-tabs{display:flex;gap:9px;margin-bottom:20px}.memory-scope-tabs button{padding:12px 17px;color:#1b2942}.memory-scope-tabs .selected{color:#1768ff;border-color:#a8c6ff;background:#eaf2ff}.memory-list-box{background:white;border:1px solid #e0e7f2;border-radius:14px;padding:25px}.memory-search{display:flex;gap:17px}.memory-search input{flex:1;min-width:0;height:49px;padding:12px;font-size:16px}.memory-search select{width:123px;height:49px;font-size:16px;color:#34435c;background:white}.memory-permission{padding:16px;border-radius:9px;background:#f2f6fc;color:#7587a3;font-size:13px;line-height:1.7;margin-top:17px}.memory-data-page #cards{margin-top:17px}.memory-tr{grid-template-columns:minmax(220px,1fr) 100px 64px 100px;gap:16px;padding:17px 12px;font-size:14px}.memory-th{background:#f8fafe;color:#8897ae;font-weight:600;padding:16px 12px}.memory-tr button{padding:5px 0;border:0;background:none;color:#1768ff;white-space:nowrap}.memory-tr small{font-size:13px;color:#8193b0}.memory-tr .tag{white-space:nowrap;margin:0;padding:6px 9px;font-size:12px}.memory-tr p{line-height:1.7}@media(max-width:700px){.memory-list-box{padding:15px;overflow-x:auto}.memory-table{min-width:620px}.memory-heading h2{font-size:21px}}
.memory-tr{grid-template-columns:minmax(220px,1fr) 110px 105px 100px}.memory-status{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:13px}.memory-status .switch{margin:0}.memory-row-actions{display:flex;gap:18px}.memory-row-actions .danger{color:#e75b65}.memory-content{white-space:pre-wrap;overflow-wrap:anywhere;color:#1b2942}.switch:focus-visible{outline:2px solid #1768e8;outline-offset:3px}.memory-overview{background:#fff;border:1px solid #e0e7f2;border-radius:12px;padding:20px 25px;margin-bottom:18px}.memory-overview h3{margin:0;font-size:16px}.memory-overview p{margin:12px 0;color:#344861;line-height:1.9}.memory-overview .row{flex-wrap:wrap}</style><header class="top"><a href="ontology-agents.html">←</a><div class="logo">AI</div><div><h1>采购分析助手</h1><small>智能体配置 / 记忆管理</small></div><span class="spacer"></span></header><div class="layout"><aside class="left"><div class="tabs"><button data-tab="config">记忆配置</button></div><div id="left"></div></aside><main class="chat"><div class="chathead row"><b>对话调试</b><button id="newchat">＋ 新建会话</button></div><div class="stream" id="stream"></div><div class="composer"><textarea id="question" placeholder="试试：请记住，报告优先使用表格呈现"></textarea><div class="controls"><label><input id="read" type="checkbox" checked>读取私有记忆</label><label><input id="write" type="checkbox" checked>保存新记忆</label><span class="spacer"></span><button class="primary" id="send">发送 ↑</button></div><small>测试身份仅使用演示数据 · 未连接模型和服务端鉴权</small></div></main><aside class="right"><div class="tabs"><button class="active">推理链路</button></div><span class="tag">模拟链路</span><div id="trace" style="margin-top:24px"></div></aside></div><div id="modal"></div><script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const memoryParams=new URLSearchParams(location.search),dataMode=memoryParams.get('view')==='data';let user='A',tab=dataMode?'data':'config',scope='private',query='',filter='all',seq=5,logs=[],cfg={enabled:false,private:true,public:false},prefs={A:{read:true,write:true},B:{read:true,write:true}};const seed=()=>[{id:1,owner:'A',content:'报告默认使用表格，并列出关键差异。',type:'偏好',status:true,version:1,source:'测试用户 A 的会话 · 消息 A-018',history:['v1 · 用户明确要求记住']},{id:2,owner:'A',content:'当前采购分析任务仅关注有效供应商。',type:'任务',status:true,version:1,source:'测试用户 A 的会话 · 消息 A-023',history:['v1 · 从用户消息提取']},{id:3,owner:'B',content:'分析结果先给结论，再列数据依据。',type:'偏好',status:true,version:1,source:'测试用户 B 的会话 · 消息 B-007',history:['v1 · 用户明确要求记住']},{id:4,owner:null,content:'采购分析应结合本体中的供应商、零件及采购合同关系。',type:'业务过程',status:true,version:1,source:'管理员手动录入 · 采购分析使用说明',history:['v1 · 管理员创建']}];let memories=seed();function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2600)}function visible(m){return m.owner===user||m.owner===null&&(user==='A'||m.status)}function canEdit(m){return m.owner===user||m.owner===null&&user==='A'}function toggle(k,title,desc){return `<div class="setting"><div class="row"><b>${title}</b><input class="switch" type="checkbox" data-config="${k}" ${cfg[k]?'checked':''} ${user!=='A'||k!=='enabled'&&!cfg.enabled?'disabled':''}></div><p>${desc}</p></div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#left').innerHTML=tab==='config'?`<h2>长期记忆</h2><small>当前智能体 · 采购分析助手</small>${toggle('enabled','启用长期记忆','关闭后停止读写，已有记录保留。')}${toggle('private','用户私有记忆','每位用户单独记录记忆，仅供本人使用。')}${toggle('public','智能体公共记忆','使用该智能体的所有用户使用同一份公共记忆。')}<div class="setting"><b>私有记忆写入</b><p>自动提取 · 敏感凭据及不确定内容跳过</p></div><div class="setting"><b>来源与变更记录 <span class="tag green">强制开启</span></b><p>记录来源、版本和实际注入结果。</p></div><div class="note">${user==='A'?'配置即时生效于本次演示。':'当前身份只读，不能修改智能体策略。'}<br>智能体共享不代表用户私有记忆共享。<br>业务事实以本体和业务系统为准。</div>`:memoryListView();$('#read').checked=prefs[user].read;$('#write').checked=prefs[user].write;$('#read').disabled=$('#write').disabled=!cfg.enabled||!cfg.private}
function memoryOverview(){const scoped=memories.filter(m=>visible(m)&&(scope==='private'?m.owner===user:m.owner===null));const active=scoped.filter(m=>m.status);const descriptions={1:'偏好以表格呈现报告，并突出关键差异',2:'当前采购分析聚焦有效供应商',3:'偏好先呈现结论，再提供数据依据',4:'采购分析以本体中的供应商、零件及采购合同关系为共同参考'};const parts=[...new Set(active.map(m=>descriptions[m.id]||m.content.replace(/[。；]+$/,'')))];const text=!scoped.length?'暂无记忆，尚无可总结的内容。':!active.length?'当前范围的记忆均已禁用，暂无生效的记忆内容。':parts.join('；')+'。';return '<section class="memory-overview"><div class="row"><h3>'+(scope==='private'?'我的记忆概况':'智能体公共记忆概况')+'</h3><span class="muted">共 '+scoped.length+' 条 · 启用 '+active.length+' 条 · 禁用 '+(scoped.length-active.length)+' 条</span></div><p>'+E(text)+'</p><small>总结当前范围内已启用的记忆，不受列表搜索和状态筛选影响。</small></section>'}
function memoryListView(){return `<div class="memory-heading"><div><h2>记忆数据</h2></div></div><div class="memory-scope-tabs"><button data-scope="private" class="${scope==='private'?'selected':''}">我的记忆</button><button data-scope="public" class="${scope==='public'?'selected':''}">智能体公共记忆</button></div>${memoryOverview()}<section class="memory-list-box"><div class="memory-search"><input id="search" placeholder="搜索记忆内容或来源" value="${E(query)}"><select id="filter"><option value="all">全部状态</option><option value="active" ${filter==='active'?'selected':''}>启用</option><option value="off" ${filter==='off'?'selected':''}>禁用</option></select></div><div class="memory-permission">${scope==='private'?'每位用户的私有记忆单独记录，仅供本人查看和使用。':'使用该智能体的所有用户共享同一份公共记忆。'}</div><div id="cards">${cards()}</div></section>`}
function cards(){const rows=memories.filter(m=>visible(m)&&(scope==='private'?m.owner===user:m.owner===null)&&(m.content+' '+m.source).includes(query)&&(filter==='all'||m.status===(filter==='active')));return '<div class="memory-table"><div class="memory-tr memory-th"><span>记忆内容 / 来源</span><span>归属</span><span>状态</span><span>操作</span></div>'+rows.map(m=>'<div class="memory-tr"><div><p>'+E(m.content)+'</p><small>'+E(m.source)+' · 2026-10-24</small></div><span><i class="tag">'+(m.owner?'用户 '+m.owner+' · 私有':'智能体公共')+'</i></span><label class="memory-status"><input class="switch" type="checkbox" role="switch" aria-label="'+E(m.content)+'：启用记忆" data-memory-status="'+m.id+'" '+(m.status?'checked ':'')+(canEdit(m)?'':'disabled')+'><span>'+(m.status?'启用':'禁用')+'</span></label><div class="memory-row-actions"><button data-detail="'+m.id+'">详情</button>'+(canEdit(m)?'<button class="danger" data-delete="'+m.id+'">删除</button>':'')+'</div></div>').join('')+(rows.length?'':'<div class="empty">暂无匹配的记忆</div>')+'</div>'}

function home(){$('#stream').innerHTML='<div class="welcome"><div class="logo" style="display:inline-block;margin-bottom:20px">AI</div><h2>让每次对话有所积累</h2><p>启用长期记忆，体验跨会话记忆与来源追溯。</p><div class="suggest"><button data-prompt="请记住，报告优先使用表格呈现">记住我的偏好</button><button data-prompt="请根据我的偏好生成采购分析摘要">验证记忆召回</button></div></div>';$('#trace').innerHTML='<div class="empty">发送消息后查看模拟链路</div>'}
function detail(id){const m=memories.find(x=>x.id===id);if(!m||!visible(m))return toast('无权访问或记忆已删除');$('#modal').innerHTML='<div class="overlay"><section class="drawer"><div class="row"><h2>记忆详情</h2><button data-close>关闭 ×</button></div><h3>记忆内容</h3><div class="memory-info memory-content">'+E(m.content)+'</div><h3>记忆范围</h3><span class="tag">'+(m.owner?'用户私有':'智能体公共')+'</span><h3>记忆来源与归属</h3><div class="memory-info">智能体：'+E(memoryParams.get('name')||memoryParams.get('agent')||'采购分析助手')+'<br>归属：'+(m.owner?'用户 '+m.owner:'智能体公共')+'<br>来源：'+E(m.source)+'<br>创建时间：2026-10-24（演示）</div><details style="margin-top:20px"><summary>使用记录</summary>'+(logs.filter(l=>l.user===user&&l.items.some(x=>x.id===id)).map(l=>'<p>'+E(l.time)+' · '+E(l.id)+'（模拟）</p>').join('')||'<p class="muted">暂无当前用户的调用记录</p>')+'</details></section></div>'}

function send(){const q=$('#question').value.trim();if(!q)return;const items=cfg.enabled?memories.filter(m=>m.status&&(m.owner===user&&cfg.private&&prefs[user].read||m.owner===null&&cfg.public)).map(m=>({...m})):[];const run={id:'RUN-'+(logs.length+1),user,time:new Date().toLocaleTimeString(),items};logs.push(run);if($('#stream .welcome'))$('#stream').innerHTML='';let saved=null;if(q.includes('记住')&&cfg.enabled&&cfg.private&&prefs[user].write){if(/密码|密钥|口令|token/i.test(q)){toast('演示过滤：敏感凭据不保存')}else{saved={id:seq++,owner:user,content:q.replace(/^.*?记住[，,:：\s]*/,''),type:'偏好',status:true,version:1,source:'测试用户 '+user+' · '+run.id+' · 用户明确要求记住',history:['v1 · 用户明确要求记住']};memories.push(saved)}}$('#stream').insertAdjacentHTML('beforeend',`<div class="message question"><span>${E(q)}</span></div><div class="message response"><b>✦ 采购分析助手</b><p>${saved?'已保存你的偏好，后续会话可继续使用。':items.length?'已读取当前身份可用的记忆。以下是本次可参考的信息：':'本次未读取长期记忆，将仅依据当前问题回答。'}${items.map(m=>'<br>• '+E(m.content)).join('')}</p><small>演示回答，未执行真实业务查询。</small><div style="margin-top:12px"><button data-run="${run.id}">本轮记忆参考 · ${items.length} 条</button>${saved?` <button data-detail="${saved.id}">查看新增记忆</button> <button data-undo="${saved.id}">撤销保存</button>`:''}</div></div>`);$('#question').value='';$('#stream').scrollTop=$('#stream').scrollHeight;$('#trace').innerHTML=`<div class="step"><b>身份与权限</b><p>演示租户 / 用户 ${user}<br>采购分析助手 · 已授权（模拟）</p></div><div class="step"><b>记忆检索与隔离</b><p>${cfg.enabled?'排除其他用户私有记忆、停用条目':'长期记忆已关闭'}</p></div><div class="step"><b>注入上下文 · ${items.length} 条</b>${items.map(m=>`<div class="card" data-detail="${m.id}"><small>${m.owner?'私有':'公共'} · M-${m.id} · v${m.version}</small><p>${E(m.content)}</p></div>`).join('')}</div><div class="step"><b>回答与记忆写入</b><p>${saved?'新增 1 条私有记忆':'未新增记忆'}<br>${run.id} · 模拟执行</p></div>`;render()}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-detail]');if(!b)return;const d=b.dataset;if(d.tab){tab=d.tab;render()}if(d.scope){scope=d.scope;render()}if(d.detail)detail(+d.detail);if('close'in d)$('#modal').innerHTML='';if(d.prompt){$('#question').value=d.prompt;$('#question').focus()}if(d.delete||d.undo){const id=+(d.delete||d.undo),m=memories.find(x=>x.id===id);if(!m||!canEdit(m))return;if(d.delete&&!confirm('删除后不再参与后续调用，历史演示回答不会自动改写。确认删除？'))return;memories=memories.filter(x=>x.id!==id);$('#modal').innerHTML='';render();toast('已移除记忆')}if(d.run){const l=logs.find(x=>x.id===d.run&&x.user===user);if(!l)return;$('#modal').innerHTML='<div class="overlay"><section class="drawer"><div class="row"><h2>本轮记忆参考</h2><button data-close>×</button></div><p class="muted">'+l.id+' · 当时提供给模型的记忆快照，不能据此确定回答的因果关系。</p>'+l.items.map(m=>'<div class="card"><span class="tag">'+(m.owner?'私有':'公共')+' · v'+m.version+'</span><p>'+E(m.content)+'</p><small>'+E(m.source)+'</small></div>').join('')+(l.items.length?'':'<p>本轮未提供长期记忆</p>')+'</section></div>'}if(b.id==='send')send();if(b.id==='newchat'){home();toast('已清空会话，保留长期记忆')}if(b.id==='reset'){if(confirm('重置本次演示的全部修改？'))location.reload()}});
document.addEventListener('change',e=>{if(e.target.dataset.memoryStatus){const m=memories.find(x=>x.id===+e.target.dataset.memoryStatus);if(!m||!canEdit(m)){render();return}m.status=e.target.checked;m.history.unshift('v'+(++m.version)+' · 用户 '+user+' · '+(m.status?'启用':'禁用'));render();toast(m.status?'记忆已启用':'记忆已禁用');return}if(e.target.dataset.config&&user==='A'){cfg[e.target.dataset.config]=e.target.checked;render();toast('配置已更新')}if(e.target.id==='identity'){user=e.target.value;query='';filter='all';$('#modal').innerHTML='';$('#question').value='';home();render();toast('测试身份已切换，上一身份的上下文已清理')}if(e.target.id==='read'||e.target.id==='write')prefs[user][e.target.id]=e.target.checked;if(e.target.id==='filter'){filter=e.target.value;$('#cards').innerHTML=cards()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#cards').innerHTML=cards()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML='';if(e.ctrlKey&&e.key==='Enter')send()});if(dataMode){document.body.classList.add('memory-data-page');document.querySelector('h1').textContent=memoryParams.get('name')||'采购分析助手';document.querySelector('.top small').textContent='智能体 / 更多 / 记忆管理';document.querySelector('.left>.tabs').innerHTML='<h2>记忆管理</h2>';document.querySelector('.chat').hidden=true;document.querySelector('.right').hidden=true;}const memoryBack=document.querySelector('header.top>a');try{const target=new URL(memoryParams.get('return')||'knowledge-base-management.html?module=reasoning&project='+encodeURIComponent(memoryParams.get('project')||'personal'),location.href);if(target.origin===location.origin&&target.pathname.endsWith('/knowledge-base-management.html'))memoryBack.href=target.href}catch{}render();home();
</script></html>
