mark {

const baseRender=render;render=function(){baseRender();const table=sourceTables.find(t=>t.id===state.sourceId);$('#sourceSetup').innerHTML='<span class="setup-icon">'+I('file')+'</span><div class="setup-info"><small>已完成的非结构化抽取表</small><p><strong style="color:var(--ink)">'+E(table?.name||'请选择抽取结果表')+'</strong>'+(table?' <span class="tag green">已完成</span>':'')+'</p>'+(table?'<p>'+table.sheets.length+' 个 Sheet · 已映射 '+Object.keys(state.elementMapping||{}).length+' 组本体元素</p>':'')+'</div><div class="setup-model"><small>映射本体模型</small><b>'+E(state.model||'待选择')+'</b></div>'+(table?'<span class="tag">已锁定</span>':btn('选择抽取结果表','source-setup','primary'));$('#workSurface').hidden=!table;if(!$('#setupEmpty'))$('#workSurface').insertAdjacentHTML('afterend','<div id="setupEmpty" class="setup-empty">'+I('layers')+'<h2>从抽取结果开始处理</h2><p>选择已经完成抽取的表，再为各 Sheet 选择本体模型元素。</p>'+btn('选择表与本体元素','source-setup','primary')+'</div>');$('#setupEmpty').hidden=!!table;['saveBtn','exportBtn','validateBtn','historyBtn'].forEach(id=>$('#'+id).disabled=!table||(view==='raw'&&['saveBtn','exportBtn'].includes(id)));$('.heading p').innerHTML=table?'<span>'+E(table.name)+'</span><span>原始结果已保留 · 按 Sheet 处理</span>':'<span>选择结果表 → 映射本体元素 → 核对与融合 → 输出结果</span>';};
exportModal=function(){const out=exportable();modalData={output:out};openModal('export','输出处理结果','将校验通过的实体、关系与事件输出为 CSV 文件。','<div class="export-summary"><div><small>本次输出实体</small><b>'+out.rows.length+'</b></div><div><small>本次输出关系</small><b>'+out.relations.length+'</b></div><div><small>本次输出事件</small><b>'+out.events.length+'</b></div></div><label class="form-label">输出项目 <span class="tag">只读</span><input value="客户洞察项目" readonly></label><label class="form-label">路径目录 <span class="tag">只读</span><input value="个人空间" readonly></label><label class="form-label">文件名称 <span style="color:var(--red)">*</span><div style="display:flex;align-items:center;gap:10px"><input id="exportName" value="'+E((sourceTables.find(t=>t.id===state.sourceId)?.name||'抽取结果')+'_处理结果')+'"><span style="padding-top:8px;color:#8a99ad">.csv</span></div></label><div class="output-path">客户洞察项目 / 个人空间 / <span id="outputFilename"></span>.csv</div><div class="callout">仅输出校验通过的记录。关系和事件引用的实体需同时满足输出条件。不同类型以“记录类型”和“Sheet”列区分。</div><small>独立原型将下载本地文件；项目与路径为 mock 保存位置。</small>',footer('download-csv','输出 CSV'),true);$('#outputFilename').textContent=$('#exportName').value;$('[data-action="download-csv"]').disabled=!(out.rows.length+out.relations.length+out.events.length)};
function applySetup(){if(state.sourceId){closeModal();return}const mapping=Object.fromEntries($$('[data-element-map]').map(el=>[el.dataset.elementMap,el.value]));if(Object.values(mapping).some(v=>!v)){$('#modalError').textContent='请选择每个 Sheet 对应的本体元素。';return}const changed=state.sourceId!==setupDraft.sourceId;if(changed){state=initial();undoStack=[];if(setupDraft.sourceId==='suppliers'){state.rows=state.rows.filter(r=>r.type==='供应商');state.relations=[];state.events=[];}Object.assign(baseline,structuredClone(state));}state.sourceId=setupDraft.sourceId;state.model=setupDraft.model;state.elementMapping=mapping;selected.clear();activeSheet='all';activeTab='entity';issueFilter='all';typeFilter='all';query='';$('#search').value='';focusId=state.rows[0]?.id;view='work';persist();closeModal();render();toast('已载入抽取结果，Sheet 与本体元素映射已配置');}
function downloadCsv(){let name=$('#exportName').value.trim().replace(/\.csv$/i,'');if(!name||/[<>:"/\\|?*]/.test(name)){$('#modalError').textContent='请填写有效的文件名称，不包含路径或特殊字符。';return}const out=exportable(),csv=v=>'"'+(/^[=+@-]/.test(String(v??''))?"'":'')+String(v??'').replace(/"/g,'""')+'"';const lines=[['记录类型','Sheet','本体模型','映射元素','记录ID','名称','业务编号','等级或分类','地址或规格','单位','起点实体ID','终点实体ID','关联实体ID','发生时间','来源记录']];out.rows.forEach(r=>{const sh=sheets().find(s=>s.type===r.type);lines.push(['实体',sh?.name,state.model,sh?getMappedName(sh):r.type,r.id,r.name,r.code,r.level,r.address,r.unit,'','','','',r.origins.join(';')])});out.relations.forEach(r=>{const sh=sheets().find(s=>s.kind==='relation'&&s.recordIds.includes(r.id));lines.push(['关系',sh?.name,state.model,sh?getMappedName(sh):r.name,r.id,r.name,'','','','',r.from,r.to,'','',r.id])});out.events.forEach(r=>{const sh=sheets().find(s=>s.kind==='event'&&s.recordIds.includes(r.id));lines.push(['事件',sh?.name,state.model,sh?getMappedName(sh):r.name,r.id,r.name,'','','','','','',r.subject,r.date,r.id])});const url=URL.createObjectURL(new Blob(['\ufeff'+lines.map(r=>r.map(csv).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeModal();toast('已输出 '+out.rows.length+' 个实体、'+out.relations.length+' 个关系、'+out.events.length+' 个事件');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.elementFilter){activeSheet=b.dataset.elementFilter;selected.clear();focusId=filtered()[0]?.id;render();return}if(b.dataset.sourceChoice){setupDraft.mapping=Object.fromEntries($$('[data-element-map]').map(el=>[el.dataset.elementMap,el.value]));setupDraft.sourceId=b.dataset.sourceChoice;renderSourceModal();return}if(b.dataset.process){issueFilter=b.dataset.process;activeTab=issueFilter==='unresolved'?'relation':'entity';activeSheet='all';typeFilter='all';selected.clear();focusId=filtered()[0]?.id;render();return}if(b.dataset.action==='source-setup')sourceModal();if(b.dataset.action==='apply-source')applySetup();if(b.dataset.action==='download-csv')downloadCsv();if(b.dataset.action==='show-graph'){activeTab='graph';activeSheet='all';issueFilter='all';selected.clear();render()}});
document.addEventListener('change',e=>{if(e.target.dataset.elementMap)$('#modalError').textContent='';if(e.target.id==='setupModel'){setupDraft.mapping=Object.fromEntries($$('[data-element-map]').map(el=>[el.dataset.elementMap,el.value]));setupDraft.model=e.target.value;renderSourceModal()}});
document.addEventListener('input',e=>{if(e.target.id==='exportName'&&$('#outputFilename'))$('#outputFilename').textContent=e.target.value.replace(/\.csv$/i,'')});
if(state.sourceId==='suppliers'){const original=initial();Object.assign(baseline,{...original,rows:original.rows.filter(r=>r.type==='供应商'),relations:[],events:[]})}
render();

</script>
