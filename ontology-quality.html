e1e8f3;border-radius:9px;padding:18px}.stat b{font-size:26px;display:block;margin:8px 0}.tabs{display:flex;gap:25px;border-bottom:1px solid #e0e6ef;margin:20px 0}.tabs button{border:0;border-radius:0;padding:12px 0}.tabs .active{color:#0864ff;border-bottom:2px solid #0864ff}.box{border:1px solid #e0e8f4;border-radius:12px;padding:20px}.filters{display:flex;gap:10px;margin-bottom:15px}.filters input{flex:1;min-width:0}.filters input,select,textarea{border:1px solid #dce5f2;border-radius:7px;padding:10px;background:white;color:#344861}.notice{padding:13px;background:#f3f7fd;color:#7487a4;border-radius:8px;font-size:12px;line-height:1.8;margin-bottom:18px}.table{width:100%;border-collapse:collapse}.table th{background:#f8faff;color:#8292aa;font-weight:500;text-align:left}.table th,.table td{padding:15px 12px;border-bottom:1px solid #e8edf5;line-height:1.7}.table button{border:0;color:#0962ff;padding:3px;background:none}.badge{font-size:12px;padding:4px 8px;border-radius:5px;background:#fff3df;color:#b67716;white-space:nowrap}.badge.gray{background:#edf1f6;color:#7f8da2}.badge.green{background:#e8f8f0;color:#19815c}.mask{position:fixed;inset:0;background:#17274455;display:flex;align-items:center;justify-content:center;z-index:5}.dialog{background:white;border-radius:14px;width:min(610px,94vw);max-height:90vh;overflow:auto;padding:26px}.dialog h2{margin:0;font-size:19px}.dialog label{display:block;margin:18px 0;line-height:1.8}.dialog textarea{width:100%;min-height:90px;resize:vertical}.dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.drawer{margin-left:auto;height:100%;max-height:100%;width:min(590px,95vw);border-radius:0;padding:28px;overflow:auto;background:#fff}.drawer h3{font-size:14px;margin-top:25px}.evidence{background:#f4f7fc;padding:15px;border-radius:8px;line-height:1.9}.drawer p{line-height:1.9}.progress{height:6px;background:#e9f0fd;margin:25px 0;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#0962ff;animation:run 1.2s linear forwards}@keyframes run{from{width:0}to{width:100%}}.node{display:inline-block;border:1px solid #9dbfff;background:#f2f7ff;border-radius:8px;padding:15px 23px;margin:15px}.row{display:flex;gap:12px;align-items:center}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 20px;background:#223857;color:white;border-radius:8px;z-index:20}@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}.workspace{padding:18px}.planes{left:38%}.table{min-width:680px}.box{overflow:auto}}@media(max-width:650px){nav{display:none}.shell{display:block}.summary{grid-template-columns:1fr}.bar{flex-wrap:wrap}.global{height:580px}.levels{left:0}.planes{left:46%;width:50%}.plane{gap:2px}.heading{flex-wrap:wrap}}
.shell{display:block}.shell>nav{display:none}body.embedded{background:transparent}body.embedded:not(.has-report)>.top,body.embedded:not(.has-report)>.shell{display:none}body.embedded.has-report{background:#17274455;padding:24px}body.embedded.has-report>.top{display:none}body.embedded.has-report>.shell{max-height:calc(100vh - 48px);overflow:auto;background:white;border-radius:14px}body.embedded.has-report .bar{position:sticky;top:0;background:#fff;z-index:2}</style><header class="top"><span class="blue">▦</span><span style="font-size:25px">◈</span><b>本体管理</b><span class="spacer"></span><span class="pill">交互线框 · 演示数据</span><span>sailisi</span></header><div class="shell"><nav><small>项目构建入口</small><div>✦　本体自动构建</div><div>♧　行业本体模板</div><small>语义图谱</small><div class="active">⌘　语义图谱</div><div>⬡　业务对象</div><div>◎　业务关联</div><div>▤　事实明细</div><small>业务知识</small><div>▣　知识库</div><div>▦　数据集</div><small>业务行为与逻辑</small><div>◉　业务操作与行为</div></nav><main><div class="bar"><span class="sub">采购业务本体</span><span class="spacer"></span><button id="global" aria-label="关闭评估" title="关闭评估" style="width:40px;height:40px;padding:0;font-size:24px">×</button></div><div class="workspace" id="view"></div></main></div><div id="overlay"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search),project=params.get('project')||'personal',storageKey='knora:quality-reports:v1:'+project;function persist(){try{localStorage.setItem(storageKey,JSON.stringify(records))}catch{notify('浏览器未允许保存评估记录')}}let report=null,records=[],tab='semantic',search='',status='all';const issues=[{id:1,kind:'模型定义',name:'“金额”的业务含义不明确',object:'采购订单 · 金额',evidence:'属性名称：金额；定义：订单金额。样本中存在 12800、4500 等数值，无法从现有定义判断币种及含税口径。',advice:'补充金额口径说明；是否新增币种等属性需由业务确认。',nature:'疑似问题'},{id:2,kind:'建模合理性',name:'供应商与供货商可能存在概念重叠',object:'供应商 / 供货商',evidence:'两个实体定义均描述提供零件的企业；属性均包含名称和统一社会信用代码。需结合完整数据进一步核验，定义相近不代表重复。',advice:'确认二者是否代表不同角色。若存在业务区别，应补充定义；否则再考虑合并。',nature:'疑似问题'},{id:3,kind:'关联合理性',name:'“属于”的方向表达可能不清晰',object:'供应商 — 属于 → 零件',evidence:'模型关系方向为供应商到零件，关系说明为“供应商提供的零件”。名称与说明可能表达不同含义。',advice:'核实关系方向及含义，可将名称调整为“供应”；本评估不会自动修改模型。',nature:'疑似问题'}];const stats=[['供应商','实体','240','联系电话空值 84 条（35%）','空值不直接判错'],['供货商','实体','60','18 组代码与供应商样本重叠','疑似重复，需确认'],['零件','实体','860','未连接供应商的实例 43 条（5%）','未关联不直接判错'],['供应','关系','1,320','每个供应商平均关联 5.5 条','分布统计'],['采购','事件','520','发生时间覆盖 2026-01 至 2026-09','分布统计']];function notify(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}function close(){$('#overlay').innerHTML=''}function home(){$('#view').innerHTML='<div class="global"><div class="levels">'+[['应用层','应用 (2)<br>Agent (1)'],['逻辑层','Logic (1)<br>Tool (31)'],['行为层','Action (1)'],['语义层','Entity (3)<br>Relation (1)<br>Event (1)']].map(x=>'<section><h3><span class="blue">●　</span>'+x[0]+'</h3><small>'+x[1]+'</small></section>').join('')+'</div><div class="planes">'+['应用','工具','行为','模型'].map((x,i)=>'<div class="plane">'+(i===3?'<button data-node="供应商">供应商</button><button data-node="零件">零件</button><button data-node="采购">采购</button>':'<span class="blue">●　●　●</span>')+'</div>').join('')+'</div></div><p class="sub">示例本体用于演示评估交互；本次范围仅包含语义层的实体、关系、事件及其数据。</p>'}const embedded=params.get('embed')==='1';function exitEmbedded(){if(embedded)parent.postMessage({type:'knora-quality-close'},'*')}

function historyView(){document.body.classList.add('has-report');$('#view').innerHTML='<div class="heading"><h2>评估历史</h2><span class="spacer"></span><button class="primary" id="start2">发起评估</button></div><p class="sub">每条记录对应一次评估 · 当前项目 · 保存在当前浏览器</p><div class="box"><table class="table"><thead><tr><th>名称 / 编号</th><th>评估时间</th><th>评估内容</th><th>数据范围</th><th>状态</th><th>操作</th></tr></thead><tbody>'+records.map((r,i)=>({r,i})).reverse().map(({r,i})=>'<tr><td>'+esc(r.name||r.id)+'<br><span class="sub">'+esc(r.id)+(r.note?' · '+esc(r.note):'')+'</span></td><td>'+esc(r.time)+'</td><td>'+[r.sem?'语义质量':'',r.dat?'数据质量':''].filter(Boolean).join('、')+'</td><td>'+rangeText(r)+'</td><td><span class="badge green">已完成</span></td><td><button data-report="'+i+'">查看</button> <button data-record-edit="'+i+'">编辑</button> <button data-record-delete="'+i+'" style="color:#dc5555">删除</button></td></tr>').join('')+(records.length?'':'<tr><td colspan="6" style="text-align:center;padding:40px;color:#8996aa">暂无评估记录，完成一次评估后将自动保存。</td></tr>')+'</tbody></table></div>'}
function editRecord(index){const r=records[index];$('#overlay').innerHTML='<div class="mask"><section class="dialog"><div class="row"><h2>编辑评估记录</h2><span class="spacer"></span><button data-close>×</button></div><label>评估名称<input id="recordName" maxlength="80" value="'+esc(r.name||r.id)+'" style="display:block;width:100%;padding:10px;border:1px solid #dce5f3;border-radius:7px"></label><label>备注<textarea id="recordNote" maxlength="500">'+esc(r.note||'')+'</textarea></label><p class="sub">仅修改名称和备注，保留本次评估内容、时间与结果。</p><footer><button data-close>取消</button><button class="primary" data-record-save="'+index+'">保存</button></footer></section></div>'}
let samplingDraft=[];
function plannedCount(total,mode,ratio){return mode==='all'?total:Math.min(total,Math.ceil(total*Math.max(0,Math.min(100,ratio))/100))}
function samplingPreview(reset=true){const mode=$('#sampleMode').value,ratio=Number($('#range').value);$('#range').disabled=mode==='all';$('#ratioControl').hidden=mode==='all';$('#samplingHint').textContent=mode==='all'?'读取每张表的全部数据。':'按每张表的数据总量与所选比例计算抽样条数，向上取整；0% 不读取数据，100% 全量。可逐表调整数量。';$('#rangeLabel').textContent=mode==='all'?'全量':ratio+'%';if(reset)samplingDraft=stats.map(x=>{const total=Number(x[2].replaceAll(',',''));return {name:x[0],type:x[1],total,count:plannedCount(total,mode,ratio)}});$('#samplingPreview').innerHTML='<table class="table"><thead><tr><th>模型元素 / 表</th><th>总量</th><th>抽样条数</th><th>覆盖率</th></tr></thead><tbody>'+samplingDraft.map((x,i)=>'<tr><td>'+x.type+'：'+x.name+'</td><td>'+x.total.toLocaleString()+'</td><td><input aria-label="'+x.name+'抽样条数" data-sample="'+i+'" type="number" min="0" '+(mode==='all'?'readonly':'')+' max="'+x.total+'" step="1" value="'+x.count+'" style="width:95px;padding:6px;border:1px solid #dce5f3;border-radius:6px"></td><td id="coverage'+i+'">'+coverage(x.count,x.total)+'</td></tr>').join('')+'</tbody></table>';sampleSummary()}
function coverage(n,total){return total?(n===total?'100% · 全量':(n/total*100).toFixed(1)+'%'):'无数据'}
function sampleSummary(){$('#sampleSummary').textContent='共 '+samplingDraft.length+' 张表 · 本次读取 '+samplingDraft.reduce((n,x)=>n+x.count,0).toLocaleString()+' / '+samplingDraft.reduce((n,x)=>n+x.total,0).toLocaleString()+' 条（演示数据）'}
function config(){$('#overlay').innerHTML='<div class="mask"><section class="dialog" style="width:min(820px,94vw)"><div class="row"><h2>发起质量评估</h2><span class="spacer"></span><button data-close>×</button></div><p class="sub">采购业务本体 · 当前模型快照</p><label><input id="sem" type="checkbox" checked> 语义质量 · 模型定义、建模合理性、关联合理性</label><label><input id="dat" type="checkbox" checked> 数据质量 · 属性取值、数据分布、关联情况</label><div class="row"><b>数据范围</b><span class="spacer"></span><select id="sampleMode" aria-label="抽样策略"><option value="auto">自适应抽样</option><option value="all">全量</option></select></div><p class="sub" id="samplingHint"></p><label id="ratioControl">抽样比例 <b id="rangeLabel" style="float:right;color:#0962ff"></b><input id="range" type="range" min="0" max="100" step="1" value="10" style="display:block;width:100%;margin:18px 0;accent-color:#0962ff"><span class="row sub" style="justify-content:space-between"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></span></label><div id="samplingPreview"></div><p id="sampleSummary" class="sub"></p><p class="sub">模型定义全量评估；数据按表随机抽样。关联指标需核验完整端点索引，不以另一张表未抽中记录判断关联缺失。</p><footer><button data-close>取消</button><button class="primary" id="run">开始评估</button></footer></section></div>';samplingPreview()}
function sampleOf(x){const saved=report.sampling?.find(y=>y.name===x[0]);const total=Number(x[2].replaceAll(',',''));return saved||{name:x[0],type:x[1],total,count:report.range==='all'?total:Math.min(total,report.sampleLimit||200)}}
function rangeText(r){return r.sampling?(r.range==='all'?'全量 · ':'自适应抽样 · ')+r.sampling.reduce((n,x)=>n+x.count,0).toLocaleString()+' 条':r.range==='all'?'全量':'每表最多 '+(r.sampleLimit||200)+' 条'}

function results(){if(!report)return config();document.body.classList.add('has-report');const enabled=report.sem&&report.dat;$('#view').innerHTML='<div class="heading"><h2>质量评估</h2><span class="pill">'+report.id+' · 模拟结果</span><span class="spacer"></span><button id="start2">重新评估</button></div><p class="sub">'+report.time+'</p><div class="summary"><div class="stat">评估范围<b>3 / 1 / 1</b><span class="sub">实体 / 关系 / 事件类型</span></div><div class="stat">语义质量<b>'+ (report.sem?report.issues.length:'—')+'</b><span class="sub">'+(report.sem?'项评估发现':'本次未评估')+'</span></div><div class="stat">数据质量<b>'+(report.dat?'5':'—')+'</b><span class="sub">'+(report.dat?'类数据统计 · 不设综合分':'本次未评估')+'</span></div></div><div class="tabs">'+(report.sem?'<button data-tab="semantic" class="'+(tab==='semantic'?'active':'')+'">语义质量</button>':'')+(report.dat?'<button data-tab="data" class="'+(tab==='data'?'active':'')+'">数据质量</button>':'')+'</div><div class="box"><div class="filters"><input id="search" value="'+esc(search)+'" placeholder="搜索模型元素或问题"></div><div id="rows"></div></div>';rows()}function modelElementLabel(x){const labels={'采购订单 · 金额':'属性：采购订单.金额','供应商 / 供货商':'实体：供应商 / 实体：供货商','供应商 — 属于 → 零件':'关系：属于'};return labels[x.object]||x.object}
function rows(){let body='';if(tab==='semantic'){const list=report.issues.filter(x=>(x.name+modelElementLabel(x)+x.kind).includes(search));body='<table class="table"><thead><tr><th>模型元素</th><th>问题</th><th>评估维度</th><th>结果性质</th><th>操作</th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(modelElementLabel(x))+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.kind)+'</td><td><span class="badge">'+(x.id===1?'依据不足':'疑似问题')+'</span></td><td><button data-issue="'+x.id+'">查看详情</button></td></tr>').join('')+(list.length?'':'<tr><td colspan="5">无匹配结果</td></tr>')+'</tbody></table>'}else{const list=stats.filter(x=>(x.join(' ')+metric(x)).includes(search));body='<div class="notice">以下为模拟统计结果；各表独立抽样。空值和未关联仅是数据特征，无业务规则时不判定通过或失败。样本比例不代表全量比例。</div><table class="table"><thead><tr><th>模型元素</th><th>检查内容</th><th>评估结果</th><th>数据范围</th><th>操作</th></tr></thead><tbody>'+list.map(x=>{const q=sampleOf(x);return '<tr><td>'+esc(x[1]+'：'+x[0])+'</td><td>'+metric(x)+'</td><td>'+feature(x)+'</td><td>'+(q.count===q.total?'全量检查 '+q.count.toLocaleString()+' 条':'抽样检查 '+q.count.toLocaleString()+' 条')+'<br><span class="sub">共 '+q.total.toLocaleString()+' 条 · '+coverage(q.count,q.total)+'</span></td><td><button data-stat="'+x[0]+'">查看详情</button></td></tr>'}).join('')+(list.length?'':'<tr><td colspan="5">无匹配结果</td></tr>')+'</tbody></table>'}$('#rows').innerHTML=body}
function metric(x){return ({'供应商':'联系电话是否有值','供货商':'信用代码是否重复','零件':'是否关联供应商','供应':'供应商关联数量','采购':'发生时间覆盖范围'})[x[0]]}
function drawer(content){$('#overlay').innerHTML='<div class="mask"><section class="drawer"><div class="row"><h2>评估详情</h2><span class="spacer"></span><button data-close>关闭 ×</button></div>'+content+'</section></div>'}function issue(id){const x=report.issues.find(x=>x.id===id);const nature=x.id===1?'依据不足':'疑似问题';drawer('<span class="pill">'+esc(x.kind)+' · '+nature+'</span><h3>问题</h3><p>'+esc(x.name)+'</p><h3>模型元素</h3><p>'+esc(modelElementLabel(x))+'</p><h3>评估依据</h3><div class="evidence">'+esc(x.evidence)+'</div><h3>优化建议</h3><p>'+esc(x.advice)+'</p><p class="sub">本报告为只读评估结果，建议供参考，不自动修改模型或数据。</p>')}
function feature(x){const n=sampleOf(x).count;if(!n)return sampleOf(x).total?'未抽取数据，未计算':'无数据，未计算';if(x[0]==='供应商'){const c=Math.round(n*.35);return c+' 条联系电话为空，占已检查数据的 '+(c/n*100).toFixed(1)+'%'}if(x[0]==='供货商')return '已检查的 '+n+' 条信用代码均有值，且未发现重复';if(x[0]==='零件'){const c=Math.round(n*.05);return c+' 个零件未关联供应商，占已检查数据的 '+(c/n*100).toFixed(1)+'%'}if(x[0]==='供应')return '已检查 '+n+' 条供应关系，涉及 '+Math.min(240,Math.ceil(n/5.5))+' 个供应商';return '已检查记录的发生时间：2026年1月—9月'}
function explore(name){const x=stats.find(x=>x[0]===name);drawer('<h3>'+name+' · 数据质量</h3><div class="evidence">类型：'+x[1]+'<br>实例总量：'+x[2]+'<br>统计范围：'+sampleOf(x).count+' / '+sampleOf(x).total+' 条（'+coverage(sampleOf(x).count,sampleOf(x).total)+'）'+'<br>发现：'+feature(x)+'</div><h3>样本记录</h3><table class="table"><tr><th>记录</th><th>取值示例</th></tr><tr><td>DEMO-001</td><td>'+ (name==='供应商'?'联系电话为空':'示例值 A')+'</td></tr><tr><td>DEMO-002</td><td>'+ (name==='供应商'?'联系电话为空':'示例值 B')+'</td></tr></table><p class="sub">以上为交互示例，不是真实业务数据。空值、未关联和极端值仅提示核实，不作为违反模型约束的错误。</p>')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if('close'in d){close();if(embedded&&!document.body.classList.contains('has-report'))exitEmbedded()}if(b.id==='global'){if(embedded){exitEmbedded();return}const target=params.get('return');let u;try{u=new URL(target||'knowledge-base-management.html?module=graph',location.href)}catch{}if(u&&u.origin===location.origin&&u.pathname.endsWith('/knowledge-base-management.html'))location.href=u.href;else location.href='knowledge-base-management.html?module=graph&project='+encodeURIComponent(project)}if(b.id==='start'||b.id==='start2')config();if(d.tab){tab=d.tab;search='';status='all';results()}if(d.issue)issue(+d.issue);if(d.stat)explore(d.stat);if(d.node||d.locate){drawer('<h3>模型元素定位</h3><div class="node">'+esc(d.node||d.locate)+'</div><p>已定位当前评估关联的模型元素。</p><div class="evidence">定义、属性与关联关系在此预览。正式接入后可进入平台现有模型编辑页面。</div><p class="sub">当前为线框演示，不修改现有本体。</p>')}if(b.id==='history'){close();historyView()}if(d.recordEdit!==undefined)editRecord(+d.recordEdit);if(d.recordSave!==undefined){const name=$('#recordName').value.trim();if(!name)return notify('请输入评估名称');const r=records[+d.recordSave];r.name=name;r.note=$('#recordNote').value.trim();persist();close();historyView();notify('记录已更新')}if(d.recordDelete!==undefined){const index=+d.recordDelete;$('#overlay').innerHTML='<div class="mask"><section class="dialog"><h2>删除评估记录</h2><p>确定删除“'+esc(records[index].name||records[index].id)+'”？本次评估报告将被移除，不影响本体模型和业务数据。</p><footer><button data-close>取消</button><button class="primary" data-record-remove="'+index+'">确认删除</button></footer></section></div>'}if(d.recordRemove!==undefined){const removed=records.splice(+d.recordRemove,1)[0];if(report===removed)report=null;persist();close();historyView();notify('记录已删除')}if(d.report!==undefined){report=records[+d.report];tab=report.sem?'semantic':'data';search='';status='all';close();results()}if(b.id==='run'){const sem=$('#sem').checked,dat=$('#dat').checked;if(!sem&&!dat)return notify('至少选择一个评估部分');report={id:'EVAL-'+Date.now().toString(36).toUpperCase(),name:'本体质量评估 '+new Date().toLocaleString('zh-CN'),note:'',time:new Date().toLocaleString('zh-CN'),sem,dat,sampling:samplingDraft.map(x=>({...x})),samplingMode:$('#sampleMode').value,range:samplingDraft.every(x=>x.count===x.total)?'all':'sample',sampleRatio:$('#sampleMode').value==='all'?100:Number($('#range').value),context:'',issues:issues.map(x=>({...x}))};tab=sem?'semantic':'data';search='';status='all';$('#overlay').innerHTML='<div class="mask"><section class="dialog"><h2>正在评估 · 模拟执行</h2><div class="progress"><i></i></div><p class="sub">读取模型快照 → '+(sem?'语义评审 → ':'')+(dat?'数据统计 → ':'')+'生成报告</p></section></div>';setTimeout(()=>{records.push(report);persist();close();results()},1250)}});document.addEventListener('input',e=>{if(e.target.id==='range')samplingPreview();if(e.target.dataset.sample!==undefined){const x=samplingDraft[+e.target.dataset.sample];x.count=Math.min(x.total,Math.max(0,Math.floor(Number(e.target.value)||0)));$('#coverage'+e.target.dataset.sample).textContent=coverage(x.count,x.total);sampleSummary()}if(e.target.id==='search'){search=e.target.value;rows()}});document.addEventListener('change',e=>{if(e.target.id==='sampleMode')samplingPreview();if(e.target.dataset.sample!==undefined)e.target.value=samplingDraft[+e.target.dataset.sample].count});document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();if(embedded&&!document.body.classList.contains('has-report'))exitEmbedded()}});try{records=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(records))records=[]}catch{records=[]}document.querySelector('.bar>.sub').textContent='当前项目 · '+project;home();if(embedded){document.body.classList.add('embedded');if(params.get('mode')==='history')historyView();else config()}else if(records.length){report=records[records.length-1];tab=report.sem?'semantic':'data';results()}else config();
</script></html>
