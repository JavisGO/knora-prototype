<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流程智能体｜Knora</title><style>body{margin:0;background:#f4f7fb;color:#263950;font:14px/1.5 Arial,'Microsoft YaHei',sans-serif}header{height:62px;display:flex;align-items:center;gap:14px;padding:0 28px;background:white;border-bottom:1px solid #dfe7f1}header a{color:#176ef3;text-decoration:none}header i{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:#fff0e8;color:#c96c34;font-style:normal;font-weight:800}main{max-width:930px;margin:28px auto;background:white;min-height:70vh;border:1px solid #e0e8f2;border-radius:14px;display:flex;flex-direction:column}main h2{margin:0;padding:23px 28px;border-bottom:1px solid #edf1f6;font-size:18px}#messages{flex:1;padding:26px;display:flex;flex-direction:column;gap:16px}.bubble{max-width:72%;padding:12px 17px;border-radius:12px;background:#f0f5fc}.bubble.mine{align-self:flex-end;background:#e8f2ff}form{display:flex;gap:10px;padding:20px 26px;border-top:1px solid #edf1f6}form input{flex:1;border:1px solid #d5dfec;border-radius:8px;padding:11px}button{border:0;border-radius:8px;background:#176ef3;color:white;padding:0 22px;cursor:pointer}</style></head><body><header><a href="portal-home.html">← 返回首页</a><i>流</i><b>流程智能体 Bot</b></header><main><h2 id="flowName">流程智能体</h2><div id="messages"><div class="bubble">您好，请描述您希望流程处理的业务问题。</div></div><form id="botForm"><input id="prompt" placeholder="输入问题或执行指令"><button>发送</button></form></main><script>var p=new URLSearchParams(location.search),n=p.get('name')||'流程智能体';document.getElementById('flowName').textContent=n;document.getElementById('botForm').onsubmit=function(e){e.preventDefault();var input=document.getElementById('prompt'),v=input.value.trim();if(!v)return;var box=document.getElementById('messages');function add(t,c){var d=document.createElement('div');d.className='bubble '+c;d.textContent=t;box.appendChild(d)}add(v,'mine');add('已收到请求，流程正在处理：'+v,'');input.value=''};</script></body></html>
